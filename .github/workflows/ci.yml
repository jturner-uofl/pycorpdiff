name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies (dev + viz + temporal extras)
        # Viz extras (altair) drive the chart-spec tests; temporal extras
        # (ruptures + statsmodels) drive the changepoint + ITS tests.
        # Semantic tests use the deterministic HashEmbedder, so we don't
        # need to pay the sentence-transformers / torch download cost on
        # every CI run — that'd land in a separate slow-tier job.
        run: uv pip install --system -e ".[dev,viz,temporal]"
      - name: Run ruff
        run: ruff check src tests
      - name: Run mypy
        run: mypy src/pycorpdiff
      - name: Run pytest
        run: pytest --cov=pycorpdiff --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  docs:
    name: build mkdocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[docs,viz]"
      - run: mkdocs build --strict

  paper:
    name: regenerate paper replication outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[viz,temporal,paper]"
      - name: Re-run the paper replication script
        # Regenerates paper/figures/*.svg and paper/replication/paper_outputs.json
        # from the published package code. If any cell or figure differs
        # from what the manuscript cites, this job goes red and forces a
        # paper update in the same PR.
        run: python paper/replication/reproduce.py
      - name: Confirm the JSON has the documented schema
        run: |
          python - <<'PY'
          import json, sys
          out = json.loads(open("paper/replication/paper_outputs.json").read())
          required = {
              "table_1_keyness_top12", "table_2_its_results",
              "table_3_semantic", "changepoints", "corpus_size",
          }
          missing = required - set(out)
          if missing:
              sys.exit(f"FAIL: paper_outputs.json missing keys {sorted(missing)}")
          if len(out["table_1_keyness_top12"]) != 12:
              sys.exit("FAIL: top-12 keyness should have 12 rows")
          print("OK: paper_outputs.json has expected schema")
          PY
      - name: Upload paper artefacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-replication
          path: |
            paper/figures/
            paper/replication/paper_outputs.json

  tutorial:
    name: execute tutorial notebook (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      # Same surface a user would hit: pycorpdiff + viz extras + jupyter
      # to run the notebook. Failing this job means the public API has
      # drifted from the canonical tutorial — fix one or the other in the
      # same PR.
      - run: uv pip install --system -e ".[viz,docs]"
      - name: Re-execute the tutorial in a temp file
        run: |
          jupyter nbconvert --to notebook --execute \
            examples/pycorpdiff_tutorial.ipynb \
            --output /tmp/pycorpdiff_tutorial_executed.ipynb
