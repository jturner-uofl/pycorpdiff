name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies (dev + viz + temporal + duckdb + polars)
        # Viz drives the chart-spec tests; temporal drives changepoint +
        # ITS; duckdb drives read_duckdb; polars drives the polars-interop
        # tests. Semantic tests use the deterministic HashEmbedder so we
        # don't pay the sentence-transformers / torch download cost on
        # every CI run — the SBERT-backed tests live in `sbert-slow`.
        run: uv pip install --system -e ".[dev,viz,temporal,duckdb,polars]"
      - name: Run ruff
        run: ruff check src tests
      - name: Run mypy
        run: mypy src/pycorpdiff
      - name: Run pytest
        run: pytest --cov=pycorpdiff --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  sbert-slow:
    name: SBERT integration (slow tier)
    # Only on push to main + manual dispatch; PRs use the fast default
    # suite. Downloading torch + the all-MiniLM-L6-v2 model is heavy;
    # running it on every PR would balloon CI wall-clock for little
    # incremental signal. PR-tier coverage of the semantic surface is
    # the deterministic HashEmbedder tests in the default `test` job.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[dev,semantic]"
      - name: Cache the HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Bump this key when the default model in SBERTEmbedder changes.
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2
      - name: Run the slow SBERT integration suite
        run: pytest -m slow tests/integration/test_sbert_slow.py

  notebooks:
    name: execute example notebooks (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      # The notebooks are the canonical demos shipped to users; if the
      # public API drifts away from what the notebooks expect, either the
      # API or the notebook needs to change in the same commit. Failing
      # this job surfaces that drift loudly.
      - run: uv pip install --system -e ".[viz,temporal,polars,duckdb,notebooks]" scattertext
      - name: Re-execute the tutorial
        run: |
          jupyter nbconvert --to notebook --execute \
            examples/pycorpdiff_tutorial.ipynb \
            --output /tmp/pycorpdiff_tutorial_executed.ipynb
      - name: Re-execute the Hansard demo
        run: |
          jupyter nbconvert --to notebook --execute \
            examples/hansard_demo.ipynb \
            --output /tmp/hansard_demo_executed.ipynb
      - name: Re-execute the showcase
        run: |
          jupyter nbconvert --to notebook --execute \
            examples/pycorpdiff_showcase.ipynb \
            --output /tmp/pycorpdiff_showcase_executed.ipynb
