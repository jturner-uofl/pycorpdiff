name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies (dev + viz + temporal + duckdb extras)
        # Viz extras (altair) drive the chart-spec tests; temporal extras
        # (ruptures + statsmodels) drive the changepoint + ITS tests;
        # duckdb drives the read_duckdb tests. Semantic tests use the
        # deterministic HashEmbedder so we don't pay the sentence-
        # transformers / torch download cost on every CI run — the
        # SBERT-backed tests live in the `sbert-slow` job.
        run: uv pip install --system -e ".[dev,viz,temporal,duckdb]"
      - name: Run ruff
        run: ruff check src tests
      - name: Run mypy
        run: mypy src/pycorpdiff
      - name: Run pytest
        run: pytest --cov=pycorpdiff --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  docs:
    name: build mkdocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[docs,viz]"
      - run: mkdocs build --strict

  benchmarks:
    name: benchmarks smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[dev]" asv
      - name: Verify the benchmark suite parses (asv check)
        run: asv check --python=same
      - name: Run one method per benchmark class as a wall-clock smoke check
        # Persistent regression tracking via `asv run` is a future
        # iteration that needs a baseline + history. For now we just
        # make sure the benchmark code itself stays runnable across
        # API changes.
        run: python -m benchmarks.smoke

  paper:
    name: regenerate paper replication outputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[viz,temporal,paper]"
      - name: Re-run the paper replication script
        # Regenerates paper/figures/*.svg and paper/replication/paper_outputs.json
        # from the published package code. If any cell or figure differs
        # from what the manuscript cites, this job goes red and forces a
        # paper update in the same PR.
        run: python paper/replication/reproduce.py
      - name: Confirm the JSON has the documented schema
        run: |
          python - <<'PY'
          import json, sys
          out = json.loads(open("paper/replication/paper_outputs.json").read())
          required = {
              "table_1_keyness_top12", "table_2_its_results",
              "table_3_semantic", "changepoints", "corpus_size",
          }
          missing = required - set(out)
          if missing:
              sys.exit(f"FAIL: paper_outputs.json missing keys {sorted(missing)}")
          if len(out["table_1_keyness_top12"]) != 12:
              sys.exit("FAIL: top-12 keyness should have 12 rows")
          print("OK: paper_outputs.json has expected schema")
          PY
      - name: Upload paper artefacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-replication
          path: |
            paper/figures/
            paper/replication/paper_outputs.json

  paper-pdf:
    name: compile paper.tex (LaTeX smoke check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live (only what jss.cls needs)
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            texlive-science
      - name: Compile paper (pdflatex + bibtex + pdflatex × 2)
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          bibtex paper
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
      - name: Confirm paper.pdf was produced and is non-empty
        working-directory: paper
        run: |
          test -s paper.pdf
          echo "paper.pdf: $(stat -c%s paper.pdf) bytes"
      - name: Surface undefined references / citations as errors
        # Skeleton-tolerant: we don't enforce warning-free builds yet
        # because every section is a [TODO] placeholder. The Phase-9
        # writing pass will tighten this to pysofra-style warnings-
        # as-errors. For now we only fail on UNDEFINED references —
        # those mean a \cite or \ref pointing at something we forgot to
        # define, which is a real bug even in a skeleton.
        working-directory: paper
        run: |
          if grep -E "(LaTeX Warning: Citation|LaTeX Warning: Reference).*undefined" paper.log; then
            echo "::error::undefined references or citations in paper.log"
            exit 1
          fi
      - name: Upload paper.pdf
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/paper.pdf

  sbert-slow:
    name: SBERT integration (slow tier)
    # Only on push to main + manual dispatch; PRs use the fast default
    # suite. Downloading torch + the all-MiniLM-L6-v2 model is heavy;
    # running it on every PR would balloon CI wall-clock for little
    # incremental signal. PR-tier coverage of the semantic surface is
    # the deterministic HashEmbedder tests in the default `test` job.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv pip install --system -e ".[dev,semantic]"
      - name: Cache the HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Bump this key when the default model in SBERTEmbedder changes.
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2
      - name: Run the slow SBERT integration suite
        run: pytest -m slow tests/integration/test_sbert_slow.py

  tutorial:
    name: execute tutorial notebook (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      # Same surface a user would hit: pycorpdiff + viz extras + jupyter
      # to run the notebook. Failing this job means the public API has
      # drifted from the canonical tutorial — fix one or the other in the
      # same PR.
      - run: uv pip install --system -e ".[viz,docs]"
      - name: Re-execute the tutorial in a temp file
        run: |
          jupyter nbconvert --to notebook --execute \
            examples/pycorpdiff_tutorial.ipynb \
            --output /tmp/pycorpdiff_tutorial_executed.ipynb
