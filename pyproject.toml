[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycorpdiff"
version = "0.1.0a0"
description = "Comparative corpus analysis for modern Python workflows."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jason Turner", email = "jason.s.turner@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "corpus linguistics",
    "comparative corpus analysis",
    "keyness",
    "collocation",
    "semantic change",
    "diachronic nlp",
    "digital humanities",
    "computational social science",
    "discourse analysis",
    "temporal text analysis",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.24",
    # Capped at <3 to match the constraint pysofra discovered: pandas 3.x
    # raises Pandas4Warning under strict warning filters via third-party
    # DataFrame copies. Lift when the wider PyData stack catches up.
    "pandas>=2.0,<3",
    "scipy>=1.11",
    "pyarrow>=14",
]

[project.optional-dependencies]
# Visualisation: altair-first, matplotlib retained for paper-grade figures.
viz = ["altair>=5", "matplotlib>=3.8", "networkx>=3.1"]
# Embedding-based semantic shift (Phase 2). sentence-transformers pulls
# torch transitively, which is why this is opt-in rather than a base dep.
semantic = ["sentence-transformers>=2.2", "scikit-learn>=1.3"]
# Changepoint detection + interrupted time series.
temporal = ["ruptures>=1.1", "statsmodels>=0.14"]
# Optional columnar backend. polars.from_pandas() needs pyarrow at runtime
# (mirrors pysofra's pinning).
polars = ["polars>=1.0", "pyarrow>=15"]
# Out-of-core querying for large corpora.
duckdb = ["duckdb>=0.10"]
# Multilingual tokenisation pipelines satisfy the Tokenizer protocol with
# a thin adapter; not required for the lexical-comparative core.
nlp = ["spacy>=3.7"]
# Public-text-corpus hub. Heavy (pulls pyarrow, fsspec, requests, aiohttp),
# so opt-in only — base install stays small.
huggingface = ["datasets>=2.14"]
# Required to re-render the paper's figures from paper/replication/reproduce.py.
# Pulls a Rust-backed binary that altair uses for static SVG/PNG export —
# heavy, so it's not part of the [viz] base.
paper = ["vl-convert-python>=1.5", "jupyter>=1.0", "pysofra>=0.1.0a2"]
# Meta-extra so `pycorpdiff[all]` exercises every optional code path.
all = [
    "altair>=5",
    "matplotlib>=3.8",
    "networkx>=3.1",
    "sentence-transformers>=2.2",
    "scikit-learn>=1.3",
    "datasets>=2.14",
    "ruptures>=1.1",
    "statsmodels>=0.14",
    "polars>=1.0",
    "pyarrow>=15",
    "duckdb>=0.10",
    "spacy>=3.7",
    "vl-convert-python>=1.5",
    "pysofra>=0.1.0a2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=4.1",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.6",
    # pandas-stubs sharpens mypy strict typing for pandas surfaces (per
    # pysofra). Without it, ignore_missing_imports would mask real
    # typing regressions in pandas-mediated code paths.
    "pandas-stubs>=2.2",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "jupyter>=1.0",
]

[project.urls]
Homepage = "https://github.com/jasonsturner/pycorpdiff"
Documentation = "https://github.com/jasonsturner/pycorpdiff"
Repository = "https://github.com/jasonsturner/pycorpdiff"
Issues = "https://github.com/jasonsturner/pycorpdiff/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pycorpdiff"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pycorpdiff",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CITATION.cff",
    "pyproject.toml",
]
exclude = [
    "paper",
    "docs",
    "examples",
    "benchmarks",
    "site",
    ".github",
    ".claude",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# `-m "not slow"` keeps the default run fast: slow tests (real SBERT
# model download, future cross-validation against R / Scattertext)
# are opted into with `pytest -m slow`. The dedicated CI job(s) that
# exercise them install the heavy extras separately.
addopts = "-ra --strict-markers --strict-config -m 'not slow'"
filterwarnings = ["error"]
markers = [
    "slow: tests that download models or large fixtures; opt in via `-m slow`",
]

[tool.coverage.run]
branch = false
source = ["src/pycorpdiff"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = [
    "altair",
    "altair.*",
    "duckdb",
    "duckdb.*",
    "matplotlib",
    "matplotlib.*",
    "networkx",
    "networkx.*",
    "polars",
    "polars.*",
    "ruptures",
    "ruptures.*",
    "scipy",
    "scipy.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "sklearn",
    "sklearn.*",
    "spacy",
    "spacy.*",
    "statsmodels",
    "statsmodels.*",
]
ignore_missing_imports = true
